<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHWAL-01 // ADMIN CONTROL</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --text: #10b981; --border: #065f46; --hover: #022c22; --danger: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fira Code', monospace; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 20px; }
        h1 { font-size: 18px; text-shadow: 0 0 10px var(--text); }
        .controls { display: flex; gap: 15px; align-items: center; }
        
        .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 6px 12px; cursor: pointer; font-weight: bold; border-radius: 4px; transition: 0.3s; }
        .btn-danger:hover { background: var(--danger); color: #fff; }

        /* KOTAK ERROR BARU */
        #error-box { display: none; background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); padding: 10px; margin-bottom: 20px; border-radius: 4px; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { border: 1px solid var(--border); padding: 10px; text-align: left; }
        th { background: var(--hover); text-transform: uppercase; }
        tr:hover { background: var(--hover); }
        
        .ip { color: #ef4444; font-weight: bold; }
        .ua { color: #888; font-size: 11px; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .msg { color: #fff; }
        .time { color: #888; font-size: 11px; }
        
        #login-screen { text-align: center; margin-top: 20vh; }
        input { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 10px; font-size: 16px; outline: none; margin-bottom: 10px; }
        button[onclick="checkPass()"] { background: var(--text); color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>🔒 RESTRICTED ACCESS</h1>
        <p style="margin: 10px 0 20px; color: #888;">Enter Admin Password to view surveillance logs.</p>
        <input type="password" id="pass" placeholder="Password...">
        <br>
        <button onclick="checkPass()">AUTHENTICATE</button>
    </div>

    <div id="dashboard" style="display: none;">
        <div class="header">
            <h1>👁️ AHWAL-01 // SURVEILLANCE FEED</h1>
            <div class="controls">
                <div>LIVE UPDATES: <span id="count">0</span> LOGS</div>
                <button class="btn-danger" onclick="clearLogs()">🗑️ CLEAR ALL LOGS</button>
            </div>
        </div>
        
        <!-- KOTAK ERROR BAKAL MUNCUL DI SINI KALAU ADA MASALAH -->
        <div id="error-box"></div>

        <table>
            <thead>
                <tr>
                    <th>Time</th>
                    <th>IP Address</th>
                    <th>Device / Browser</th>
                    <th>Message Intercepted</th>
                </tr>
            </thead>
            <tbody id="log-body"></tbody>
        </table>
    </div>

    <script>
        // ===== CONFIG SUPABASE =====
        const SUPABASE_URL = "https://mroukfulsjakdnsiesqv.supabase.co/rest/v1/";
        // PASTIKAN INI SAMA PERSIS DENGAN YANG DI INDEX.HTML
        const SUPABASE_KEY = "sb_publishable_wVl2TVD0LEGZwoqMSn_Diw_z5B-6BU8"; 
        const ADMIN_PASS = "rahasiaali"; 

        let refreshInterval;

        function checkPass() {
            const p = document.getElementById('pass').value;
            if (p === ADMIN_PASS) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                fetchLogs();
                refreshInterval = setInterval(fetchLogs, 5000); 
            } else {
                alert("ACCESS DENIED.");
            }
        }

        async function fetchLogs() {
            const errBox = document.getElementById('error-box');
            try {
                const res = await fetch(`${SUPABASE_URL}chat_logs?select=*&order=created_at.desc&limit=50`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                const data = await res.json();

                // JIKA DATA BUKAN BERUPA ARRAY (BERARTI ADA ERROR DARI SUPABASE)
                if (!Array.isArray(data)) {
                    errBox.style.display = 'block';
                    errBox.innerText = "❌ GAGAL MENARIK DATA: " + JSON.stringify(data);
                    return;
                }

                // JIKA SUKSES, SEMBUNYIKAN ERROR BOX
                errBox.style.display = 'none';
                
                const tbody = document.getElementById('log-body');
                tbody.innerHTML = '';
                document.getElementById('count').innerText = data.length;

                data.forEach(log => {
                    const tr = document.createElement('tr');
                    const date = new Date(log.created_at);
                    const timeStr = date.toLocaleString('id-ID');
                    
                    tr.innerHTML = `
                        <td class="time">${timeStr}</td>
                        <td class="ip">${log.ip_address || 'Unknown'}</td>
                        <td class="ua" title="${log.user_agent}">${log.user_agent}</td>
                        <td class="msg">"${log.message}"</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                errBox.style.display = 'block';
                errBox.innerText = "❌ ERROR JARINGAN: " + e.message;
            }
        }

        async function clearLogs() {
            if (confirm("⚠️ PERINGATAN!\n\nHapus SEMUA riwayat chat?")) {
                try {
                    clearInterval(refreshInterval);
                    const res = await fetch(`${SUPABASE_URL}chat_logs?id=gte.0`, {
                        method: 'DELETE',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }
                    });

                    if (res.ok) {
                        alert("✅ Semua log terhapus!");
                        document.getElementById('log-body').innerHTML = '';
                        document.getElementById('count').innerText = '0';
                    } else {
                        const err = await res.text();
                        alert("❌ Gagal menghapus: " + err);
                    }
                } catch (e) {
                    alert("❌ Error jaringan.");
                } finally {
                    refreshInterval = setInterval(fetchLogs, 5000); 
                }
            }
        }
    </script>
</body>
</html>
